name: evc-wss-outbox-quorum

x-controller-env: &controller-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_HEAP_OPTS: -Xms128m -Xmx384m

x-broker-env: &broker-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093,2@controller2:9093,3@controller3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms128m -Xmx512m

x-broker-health: &broker-health
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 20s

services:
  controller1:
    image: apache/kafka:4.1.1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1
    volumes: ["controller1-data:/var/lib/kafka/data"]
  controller2:
    image: apache/kafka:4.1.1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2
    volumes: ["controller2-data:/var/lib/kafka/data"]
  controller3:
    image: apache/kafka:4.1.1
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3
    volumes: ["controller3-data:/var/lib/kafka/data"]
  broker11:
    image: apache/kafka:4.1.1
    depends_on: [controller1, controller2, controller3]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 11
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker11:29092,EXTERNAL://127.0.0.1:19201
    ports: ["127.0.0.1:19201:9092"]
    healthcheck: *broker-health
    volumes: ["broker11-data:/var/lib/kafka/data"]
  broker12:
    image: apache/kafka:4.1.1
    depends_on: [controller1, controller2, controller3]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 12
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker12:29092,EXTERNAL://127.0.0.1:19202
    ports: ["127.0.0.1:19202:9092"]
    healthcheck: *broker-health
    volumes: ["broker12-data:/var/lib/kafka/data"]
  broker13:
    image: apache/kafka:4.1.1
    depends_on: [controller1, controller2, controller3]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 13
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker13:29092,EXTERNAL://127.0.0.1:19203
    ports: ["127.0.0.1:19203:9092"]
    healthcheck: *broker-health
    volumes: ["broker13-data:/var/lib/kafka/data"]

volumes:
  controller1-data:
  controller2-data:
  controller3-data:
  broker11-data:
  broker12-data:
  broker13-data:
