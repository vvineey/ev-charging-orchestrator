# The operator API stays local until an external authentication/access policy is approved.
server.address=127.0.0.1

# Transaction ingestion is opt-in until the local PostgreSQL/Kafka runtime is configured.
transaction.ingress.enabled=${CONTROL_TRANSACTION_INGRESS_ENABLED:false}
transaction.kafka-topic=charging.transaction.observed.v1
# Session Wh confirmation is only used by the approved synthetic recovery experiment.
transaction.recovery.experimental-session-confirmation-enabled=false
spring.sql.init.mode=never
spring.flyway.enabled=${transaction.ingress.enabled}
spring.datasource.url=${CONTROL_DB_URL:jdbc:postgresql://127.0.0.1:5432/ev_charging}
spring.datasource.username=${CONTROL_DB_USERNAME:ev_charging}
spring.datasource.password=${CONTROL_DB_PASSWORD:}
spring.kafka.consumer.group-id=transaction-inbox-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1
