# Local control-plane is loopback-only; the worker connection is HTTPS.
spring.config.import=file:${LOCAL_ENV_FILE:./.env}[.properties]
server.address=127.0.0.1
server.port=18580

telemetry.worker.base-url=https://localhost:${TELEMETRY_HTTPS_PORT}
telemetry.worker.trust-store=${TELEMETRY_TLS_TRUST_STORE}
telemetry.worker.trust-store-password=${TELEMETRY_TLS_TRUST_STORE_PASSWORD}
telemetry.worker.deadline=1s

# Explicitly enable after the local Kafka and PostgreSQL services are running.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAPSERVERS}
spring.datasource.url=${CONTROL_DB_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${CONTROL_DB_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${CONTROL_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
