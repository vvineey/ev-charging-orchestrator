# Required in local mode. bootRun uses the project root; JAR runs may override it.
spring.config.import=file:${LOCAL_ENV_FILE:./.env}[.properties]

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAPSERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
telemetry.kafka-topic=${TELEMETRY_KAFKA_TOPIC}

mqtt.url=${MQTT_URL}
mqtt.topic=${MQTT_TOPIC}
mqtt.client-id=${MQTT_CLIENT_ID}
