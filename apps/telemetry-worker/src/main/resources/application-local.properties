# Required in local mode. bootRun uses the project root; JAR runs may override it.
spring.config.import=file:${LOCAL_ENV_FILE:./.env}[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.jdbc.template.query-timeout=10s

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAPSERVERS}
telemetry.kafka-topic=${TELEMETRY_KAFKA_TOPIC}

server.address=127.0.0.1
server.port=${TELEMETRY_HTTPS_PORT}
