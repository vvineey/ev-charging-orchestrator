# Flyway is the only schema initialization mechanism.
spring.sql.init.mode=never

spring.kafka.consumer.group-id=telemetry-current-state-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=1

# The worker query listener requires TLS material; there is no HTTP fallback connector.
server.ssl.enabled=true
server.ssl.key-store=${TELEMETRY_TLS_KEY_STORE:}
server.ssl.key-store-password=${TELEMETRY_TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=telemetry-worker
